#Updates the database tables when the application starts
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/Tutoring?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql=true
server.servlet.context-path=/tutoring
server.port =8080

# Allows the frontend running on these addresses to access the backend
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Sets how many incorrect login attempts are allowed before an address is blocked
# Sets how long an address stays blocked after too many failed login attempts (in minutes)
app.security.max-failed-logins=2
app.security.lockout-minutes=2

# Limits failed login attempts from one IP address across different accounts
app.security.max-failed-logins-per-ip=10
# Sets how many new accounts one IP address can register during the tracking period
app.security.max-signups=20

# Requires requests to use HTTPS when this setting is enabled
# HTTP Basic sends the login details with every request
app.security.require-https=false

# Requires new student and tutor accounts to verify their email before they can log in
app.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}

# Sets the backend URL used to create account verification links
app.public-url=${APP_PUBLIC_URL:http://localhost:8080/tutoring}
# How long a verification link works
app.security.verification-hours=1

# Never send error details or stack traces to the client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Enables Spring MVC to use the Problem Details format when returning error responses
spring.mvc.problemdetails.enabled=true
