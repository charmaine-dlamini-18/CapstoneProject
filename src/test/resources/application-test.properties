# Test-only settings. The real application uses MySQL; tests use an in-memory database.
spring.datasource.url=jdbc:h2:mem:tutoring;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ADMIN
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test-only admin password. The application itself has no default password.
ADMIN_PASSWORD=StrongPass123
